#code: language=ansible
---
- name: Basic install, update, upgrade for pve nodes
  user: jerixen
  become: False
  vars:
    ansible_become_password: "{{supersecret_pass}}"
  hosts: pve_nodes
  gather_facts: true
  vars_files:
    - secrets.yml
  roles:
    - { role: base }
    - { role: ssh-base }
  tags:
    - base
    - ssh-base
