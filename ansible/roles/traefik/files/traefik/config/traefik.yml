http:
 #region routers
  routers:
    proxmox:
      entryPoints:
        - "https"
      rule: "Host(`proxmox.rdk.erixen.info`)"
      middlewares:
        - default-headers
        - https-redirectscheme
      tls: {}
      service: proxmox
    pihole:
      entryPoints:
        - "https"
      rule: "Host(`pihole.rdk.erixen.info`)"
      middlewares:
        - default-headers
        - addprefix-pihole
        - https-redirectscheme
      tls: {}
      service: pihole

    homeassistant:
      # For Homeassistant config, check: https://www.home-assistant.io/integrations/http/#reverse-proxies
      # This relies on Homeassistant using http. No certs are needed in the Homeassistant config.
      entryPoints:
        - "https"
      rule: "Host(`homeassistant.rdk.erixen.info`)"
      middlewares:
        - default-headers
        - https-redirectscheme
      tls: {}
      service: homeassistant

    unifi:
      entryPoints:
        - "https"
      rule: "Host(`unifi.rdk.erixen.info`)"
      middlewares:
        - default-headers
        - https-redirectscheme
      tls: {}
      service: unifi

    octopi:
      entryPoints:
        - "https"
      rule: "Host(`octoprint.rdk.erixen.info`)"
      middlewares:
        - default-headers
        - https-redirectscheme
      tls: {}
      service: octoprint


#endregion
#region services
  services:
    proxmox:
      loadBalancer:
        servers:
          - url: "https://10.1.1.10:8006"
        passHostHeader: true
    pihole:
      loadBalancer:
        servers:
          - url: "http://10.1.50.8:80"
        passHostHeader: true
    unifi:
      loadBalancer:
        servers:
          - url: "http://10.1.1.6:80"
        passHostHeader: true
    homeassistant:
      loadBalancer:
        servers:
          - url: "http://10.1.107.6:8123"
        passHostHeader: true
    octoprint:
      loadBalancer:
        servers:
          - url: "http://10.1.20.30:80"
        passHostHeader: true

#endregion
  middlewares:
    addprefix-pihole:
      addPrefix:
        prefix: "/admin"
    https-redirectscheme:
      redirectScheme:
        scheme: https
        permanent: true

    default-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 15552000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https

    default-whitelist:
      ipWhiteList:
        sourceRange:
        - "10.0.0.0/8"
        - "192.168.0.0/16"
        - "172.16.0.0/12"

    secured:
      chain:
        middlewares:
        - default-whitelist
        - default-headers
