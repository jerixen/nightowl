# code: language=ansible
---
- name: Install Traefik
  ansible.builtin.unarchive:
    src: "https://github.com/traefik/traefik/releases/download/v{{ traefik_release }}/traefik_v{{ traefik_release }}_linux_amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
  notify:
    - Restart Traefik

- name: Create Traefik group
  ansible.builtin.group:
    name: traefik
    state: present

- name: Create Traefik user
  ansible.builtin.user:
    name: traefik
    group: traefik
    shell: /sbin/nologin
    state: present
    create_home: false

- name: Set port binding capability on Traefik
  community.general.capabilities:
    path: /usr/local/bin/traefik
    capability: cap_net_bind_service+ep
    state: present

- name: Copy Traefik config
  ansible.builtin.copy:
    src: traefik
    dest: /etc
    mode: "0755"
  notify:
    - Restart Traefik

- name: Make sure CloudFlare API email is in .bashrc file of root
  become: true
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    regexp: "^CF_API_EMAIL="
    line: "CF_API_EMAIL=\"{{ CF_API_EMAIL }}\""

- name: Make sure CloudFlare API token is in .bashrc file of root
  become: true
  ansible.builtin.lineinfile:
    path: /root/.bashrc
    regexp: "^CF_DNS_API_TOKEN="
    line: "CF_DNS_API_TOKEN=\"{{ CF_DNS_API_TOKEN }}\""

- name: Create Traefik config file
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: /etc/traefik/traefik.yml
    mode: "0644"
  notify:
    - Restart Traefik

- name: Copy systemd service file to server
  ansible.builtin.copy:
    src: traefik.service
    dest: /etc/systemd/system
    owner: root
    group: root
    mode: "0644"
  notify:
    - Start Traefik
